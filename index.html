<!DOCTYPE html>

<html lang="en">

    <head> 

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="index.css">
        <link rel="icon" href="rps.png">

        <title>Rock paper scissors</title>
        

    </head>

    <body>
        
        <div id="game-ctnr">
            
            <span id="game-action"></span>
            <br>
            <span id="result">Result: </span>

            <!-- Here, i put each buttons items in its own container inside of the buttons container -->
             <!-- Also a couple of spans just for some informative text -->

            <div id="buttons">
                
                <div class="action-ctnr" id="rock-ctnr" data-color="green">
                    <img src="rock.png" alt="Icon of a rock">
                    <button id="rock-btn" class="action-btn">Rock</button>
                </div>

                <div class="action-ctnr" id="paper-ctnr" data-color="red">
                    <img src="paper.png" alt="Icon of paper">
                    <button id="paper-btn" class="action-btn">Paper</button>
                </div>

                <div class="action-ctnr" id="scissors-ctnr" data-color="blue">
                    <img src="scissors.png" alt="Icon of a pair of scissors">
                    <button id="scissors-btn" class="action-btn">Scissors</button>
                </div>
            </div>

            <span id="h-score">You: 0</span>
            <span id="c-score">Computer: 0</span>

        </div>

        <script src="index.js"></script>

    </body>

</html>
